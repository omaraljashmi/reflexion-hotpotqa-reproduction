[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexion-hotpotqa-reproduction"
version = "1.0.0"
description = "A small, reproducible implementation of Reflexion on HotPotQA-style questions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Omar Aljashmi"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

